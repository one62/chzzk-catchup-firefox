<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>치지직 따라잡기</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../src/media.js" defer></script>
    <script src="../src/auto-policy.js" defer></script>
    <script src="../src/playback-policy.js" defer></script>
    <script src="popup.js" defer></script>
    <script src="sections.js" defer></script>
    <script src="site-access.js" defer></script>
  </head>
  <body>
    <main>
      <header class="header">
        <div>
          <p class="eyebrow">CHZZK CATCHUP</p>
          <h1>치지직 따라잡기</h1>
        </div>
        <span id="state-badge" class="state-badge">확인 중</span>
      </header>

      <section class="feature-group catchup-group" aria-labelledby="catchup-title">
        <div class="feature-header">
          <h2 id="catchup-title"><button id="catchup-fold" type="button" aria-expanded="true" aria-controls="catchup-body"><span aria-hidden="true"></span> 따라잡기</button></h2>
          <input id="catchup-enabled" type="checkbox" checked disabled aria-label="따라잡기 전체 활성화">
        </div>
        <fieldset id="catchup-body" class="feature-body">
        <section class="metrics" aria-label="현재 재생 상태">
          <div class="metric metric-primary">
            <span class="metric-label" title="서버 응답 시각과 영상 시간 정보로 계산한 추정 지연의 최근 5초 평균">지연 · 5초 평균</span>
            <strong id="player-latency" class="metric-value">—</strong>
          </div>
          <div class="metric">
            <span class="metric-label" title="현재 위치에서 마지막 탐색 가능 위치까지의 시간">끝점까지</span>
            <strong id="edge-distance" class="metric-value">—</strong>
          </div>
          <div class="metric">
            <span class="metric-label">버퍼</span>
            <strong id="forward-buffer" class="metric-value">—</strong>
          </div>
        </section>

        <section class="settings-group" aria-label="연결 방식">
          <p class="section-label">현재 연결 <strong id="current-connection">—</strong></p>
          <div class="stream-buttons" role="group" aria-label="사용할 연결 방식">
            <button id="stream-auto" type="button" class="button button-secondary" aria-pressed="true">자동</button>
            <button id="stream-hls" type="button" class="button button-secondary" aria-pressed="false">HLS</button>
            <button id="stream-llhls" type="button" class="button button-secondary" aria-pressed="false">LL-HLS</button>
          </div>
          <p id="stream-status" class="help" role="status"></p>
        </section>

        <form id="auto-form" class="auto-form">
          <label class="toggle-row" for="auto-enabled">
            <span>자동 배속 따라잡기</span>
            <input id="auto-enabled" name="autoEnabled" type="checkbox" checked>
          </label>
          <div class="auto-fields">
            <div>
              <label for="auto-start">시작 버퍼</label>
              <div class="number-field">
                <input id="auto-start" name="autoStart" type="number" min="2" max="30" step="0.1" value="3" inputmode="decimal" required>
                <span aria-hidden="true">초</span>
              </div>
            </div>
            <div>
              <label for="auto-rate">배속</label>
              <select id="auto-rate" name="autoRate">
                <option value="1.1">1.1배</option>
                <option value="1.2">1.2배</option>
                <option value="1.5" selected>1.5배</option>
                <option value="2">2배</option>
              </select>
            </div>
          </div>
          <button id="save-auto" type="submit" class="button button-secondary" disabled>배속 설정 저장</button>
        </form>

        <form id="buffer-auto-form" class="settings-group">
          <label class="toggle-row" for="buffer-auto-enabled">
            <span>남길 버퍼 자동 최적화</span>
            <input id="buffer-auto-enabled" name="bufferAutoEnabled" type="checkbox" checked>
          </label>
          <p class="help">버퍼 보충 주기와 흔들림을 학습해 따라잡기에 필요한 여유를 조절합니다.</p>
          <button id="save-buffer-auto" type="submit" class="button button-secondary" disabled>버퍼 최적화 설정 저장</button>
          <p id="buffer-status" class="help" role="status"></p>
          <button id="reset-buffer" type="button" class="text-button" disabled>버퍼 학습 초기화</button>
        </form>

        <form id="margin-form" class="margin-form">
          <label class="toggle-row" for="startup-enabled">
            <span>입장 시 따라잡기</span>
            <input id="startup-enabled" name="startupEnabled" type="checkbox" checked>
          </label>
          <label for="margin">남길 버퍼</label>
          <div class="margin-controls">
            <div class="number-field">
              <input id="margin" name="margin" type="number" min="0.2" max="3" step="0.1" value="0.6" inputmode="decimal" aria-describedby="margin-help" required>
              <span aria-hidden="true">초</span>
            </div>
            <button id="save-margin" type="submit" class="button button-secondary" disabled>저장</button>
          </div>
          <p id="margin-help" class="help"></p>
        </form>

        <button id="catch-up" type="button" class="button button-primary" disabled>즉시 따라잡기</button>
        <p id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
        </fieldset>
      </section>

      <section class="feature-group clip-group" aria-labelledby="clip-title">
        <div class="feature-header">
          <h2 id="clip-title"><button id="clip-fold" type="button" aria-expanded="true" aria-controls="clip-body"><span aria-hidden="true"></span> 클립 편집기</button></h2>
          <input id="clip-enabled" type="checkbox" checked disabled aria-label="클립 편집기 전체 활성화">
        </div>
        <fieldset id="clip-body" class="feature-body">
        <button id="grant-chzzk-access" type="button" class="button button-secondary">치지직 접근 허용</button>
        <p id="site-access-status" class="help" role="status" aria-live="polite"></p>
        </fieldset>
      </section>
      <section class="feature-group chat-group" aria-labelledby="chatLayout-title">
        <div class="feature-header">
          <h2 id="chatLayout-title"><button id="chatLayout-fold" type="button" aria-expanded="true" aria-controls="chatLayout-body"><span aria-hidden="true"></span> 채팅창 하단 배치</button></h2>
          <input id="chatLayout-enabled" type="checkbox" disabled aria-label="채팅창 하단 배치 활성화">
        </div>
        <fieldset id="chatLayout-body" class="feature-body" disabled>
          <form id="chat-width-form">
            <label for="chat-width">하단 배치 기준 너비</label>
            <div class="margin-controls">
              <div class="number-field">
                <input id="chat-width" type="number" min="1" step="1" value="1000" required aria-describedby="chat-width-help">
                <span aria-hidden="true">px</span>
              </div>
              <button type="submit" class="button button-secondary">저장</button>
            </div>
            <p id="chat-width-help" class="help">페이지 표시 영역이 이 너비 이하이면 라이브와 다시보기 채팅창을 영상 아래에 표시합니다.</p>
          </form>
        </fieldset>
      </section>
    <p id="feature-note" class="help" role="status"></p>
    </main>
  </body>
</html>
